<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Economic Cycles">
  <title>Economic Cycles</title>
  <!-- Colors are copies of the app's accent fill and light canvas tokens
       (see src/index.css); an SVG in public/ is served as a standalone
       document and never sees the stylesheet, so if those tokens move, move
       these with them. Note for editors: CSS custom-property names cannot be
       written in an XML comment, because a double hyphen ends the comment and
       makes the whole file a parse error. That is not hypothetical — the
       first version of this file shipped exactly that bug and rendered as a
       browser XML error page while still returning HTTP 200. -->
  <rect width="64" height="64" rx="14" fill="#2f43c4"/>
  <!-- One cycle: expansion, peak, contraction, trough. Legible at 16px
       because it is a single 6px stroke and nothing else. -->
  <path d="M10 44 C 18 44, 20 20, 28 20 S 38 44, 46 44 S 52 28, 54 24"
        fill="none" stroke="#f8f5f0" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
